[package]
name = "rust-parser"
version = "0.1.0"
edition = "2021"
description = "Fast Excel parser and formula transpiler for excel-to-engine pipeline"

[[bin]]
name = "rust-parser"
path = "src/main.rs"

[dependencies]
# 0.35+: shared-formula expansion honors $ anchors (0.32) and no longer mangles
# LOG10-style function names into cell refs (0.35). 0.26 corrupted 1.75M member
# cells on the real A-1 model (#57 structural root) — see test-shared-formula-anchors.mjs.
calamine = "0.35"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
